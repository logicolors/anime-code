name: Refresh anime data and deploy

on:
  workflow_dispatch:
  # bangumi-master crawls at 20:00 UTC on Fridays and may run up to two hours.
  schedule:
    - cron: "30 23 * * 5"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the run instead of deploying stale data: the runner has no copy on disk.
      - name: Download anime data
        run: npm run data:update

      - name: Unit tests
        run: npm test

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
