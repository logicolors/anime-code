name = "anicode"
main = "worker/index.mjs"
compatibility_date = "2026-10-01"

[build]
command = "node scripts/build-assets.cjs"

# Same port the old Node server used.
[dev]
port = 8765

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

# One instance lists the public rooms.
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "RoomDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomDirectory"]
